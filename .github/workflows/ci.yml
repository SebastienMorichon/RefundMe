name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: lydoc_ci
          POSTGRES_USER: lydoc
          POSTGRES_PASSWORD: lydoc-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lydoc -d lydoc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lydoc:lydoc-ci-password@127.0.0.1:5432/lydoc_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MANAGED_POSTAL_ENABLED: "false"
      NEXT_PUBLIC_DOCUMENTS_PAGE_ENABLED: "false"
      SECURITY_CONTACT_EMAIL: security@example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and generate Prisma client
        run: |
          pnpm prisma:validate
          pnpm prisma:generate
      - name: Apply every migration to PostgreSQL
        run: |
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm exec prisma migrate status --schema prisma/schema.prisma
      - name: Reject Prisma schema and migration drift
        run: >-
          pnpm exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test production preflight
        shell: pwsh
        run: ./scripts/test-preflight-production.ps1
      - name: Check formatting of release-critical files
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          apps/api/src/modules/health/health.controller.ts
          apps/api/src/modules/rules/games.controller.ts
          apps/api/src/platform/http-protection.ts
          apps/web/next.config.ts
          apps/web/components/contact-form.tsx
          docker-compose.production.yml
          scripts/backup-crypto.mjs
      - name: Test
        run: pnpm test
      - name: Build production applications
        run: pnpm build
      - name: Audit production dependencies at moderate severity
        run: pnpm audit:prod

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Validate Compose configuration
        env:
          LYDOC_API_ENV_FILE: deploy/production.env.example
        run: >-
          docker compose
          --env-file deploy/production.env.example
          -f docker-compose.production.yml
          config --quiet
      - name: Check Dockerfile
        run: >-
          docker build --check
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid
          --build-arg NEXT_PUBLIC_APP_URL=https://app.example.invalid
          --build-arg NEXT_PUBLIC_MANAGED_POSTAL_ENABLED=false
          --build-arg NEXT_PUBLIC_DOCUMENTS_PAGE_ENABLED=false
          --build-arg SECURITY_CONTACT_EMAIL=security@example.invalid
          .
      - name: Build web runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: web
          push: false
          load: true
          tags: lydoc-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.invalid
            NEXT_PUBLIC_APP_URL=https://app.example.invalid
            NEXT_PUBLIC_MANAGED_POSTAL_ENABLED=false
            NEXT_PUBLIC_DOCUMENTS_PAGE_ENABLED=false
            SECURITY_CONTACT_EMAIL=security@example.invalid
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build API runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: api
          push: false
          load: true
          tags: lydoc-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Assert non-root minimal runtimes
        run: |
          test "$(docker image inspect lydoc-api:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect lydoc-web:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node lydoc-api:ci -e "require('node:fs').accessSync('/app/dist/main.js'); require.resolve('@prisma/client')"
          docker run --rm --read-only --tmpfs /tmp --entrypoint node lydoc-web:ci -e "require('node:fs').accessSync('/app/apps/web/server.js')"
      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: lydoc-api:ci
          format: spdx-json
          artifact-name: lydoc-api.spdx.json
          output-file: lydoc-api.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: lydoc-web:ci
          format: spdx-json
          artifact-name: lydoc-web.spdx.json
          output-file: lydoc-web.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Scan API image for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lydoc-api:ci
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          timeout: 10m0s
      - name: Scan web image for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lydoc-web:ci
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          timeout: 10m0s
          skip-setup-trivy: true
